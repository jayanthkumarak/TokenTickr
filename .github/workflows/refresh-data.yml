name: Refresh model data

on:
  schedule:
    - cron: '0 9 1 * *'
  workflow_dispatch:

jobs:
  refresh:
    name: Regenerate static data
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Regenerate static data
        env:
          NEXT_PUBLIC_AA_API_KEY: ${{ secrets.NEXT_PUBLIC_AA_API_KEY }}
          NEXT_PUBLIC_OPENROUTER_API_KEY: ${{ secrets.NEXT_PUBLIC_OPENROUTER_API_KEY }}
        run: npm run generate:static-data -- --force

      - name: Open refresh PR
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: 'chore(data): monthly model data refresh'
          title: 'chore(data): monthly model data refresh'
          body: 'Automated monthly refresh of OpenRouter + AA static data. Review generated diff, then merge.'
          branch: chore/monthly-data-refresh
          delete-branch: true
